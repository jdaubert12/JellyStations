services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    container_name: jellystations-jf
    ports:
      # Loopback only: the dev server is set up by script with a generated admin password and must not be reachable
      # from the rest of the network.
      - "127.0.0.1:8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
      - TZ=America/New_York
    restart: unless-stopped
