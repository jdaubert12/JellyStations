overview: "Curate always-on TV stations from your library. They appear as native Live TV channels with a full guide."
description: >
  JellyStations turns your Jellyfin library into broadcast-style TV stations. Build any number of
  stations from movies, series, collections, playlists or genres; choose a shuffled pool,
  weekly time-slot blocks, or a hand-ordered lineup; and every client tunes in through the
  built-in Live TV guide, joining whatever is airing right now.
category: "LiveTV"
artifacts:
  - "Jellyfin.Plugin.JellyStations.dll"
changelog: >
  1.18.0.0: Local radar on the weather channel. After each place's current conditions the channel now shows a loop of the last three quarters of an hour of precipitation radar over a map of the area, with nearby towns, a light-to-heavy legend and the frame clock. NOAA NEXRAD (through the Iowa Environmental Mesonet's time-enabled WMS) covers places in the contiguous United States; RainViewer covers the rest of the world. Frames are fetched every five minutes while the station is on, only the new ones each time, and cached under data/JellyStations/weather/radar. The map (coasts, lakes, borders, towns) is Natural Earth data packed into the plugin and drawn in the theme's colours, with four map areas to choose from (metro, state, regional, wide). The editor's forecast status shows the radar source and frame count per place, Fetch now refreshes radar too, and Preview screen can show the radar screen. Existing weather stations get the radar screen; untick Show the local radar screen to go back.
  1.17.0.0: Audio language and subtitles per source. Every content source (a series, a season, a collection, a genre...) can now name the audio language its items play in and a subtitle language to burn into the picture, with an option to burn them only when that audio language is missing from a file, so an anime station can run one show in Japanese with English subtitles next to dubbed ones. The editor reads the languages actually present on the source's files (GET /JellyStations/Library/Items/{id}/Languages) and lists them with file counts. Text tracks (SRT, ASS, MP4 text, WebVTT, external files) are rendered by libass after scaling and tone mapping; PGS and DVD bitmap tracks are overlaid on the source picture; embedded text tracks are extracted once into data/JellyStations/subtitles so program starts do not read the whole file, and the next program's track is extracted while the current one plays. Language codes match across spellings (ja, jpn; ger, deu). Press Refresh content after changing a source's tracks.
  1.16.2.0: Browser playback fixed. Jellyfin marks every plugin channel's video as interlaced unless it probes the stream itself, and 1.16.0.0 had turned that probe off to escape Jellyfin's permanent per-channel probe cache, so web clients (and any other client that refuses interlaced H.264) transcoded every station through a deinterlacer instead of direct-playing it. Probing is back on, and the media source id is now derived from the station and its output format (codec, resolution, SDR or HDR10), which is the key Jellyfin caches the probe under, so a station switched to or from HDR10 is probed afresh at its next tune-in. The media source container is declared as "ts" rather than "mpegts": with "mpegts" Jellyfin left out the aac_adtstoasc bitstream filter when copying the AAC track into an fMP4 HLS transcode, and the transcode died after two frames with "Operation not permitted". A reader joining a channel now starts at the latest PAT/PMT and a keyframe instead of mid-GOP, so Jellyfin's probe and transcoder, and TV apps, no longer log "non-existing PPS referenced" and show a picture at once.
  1.16.1.0: The encoding profile's preset now reaches the hardware encoders: Quick Sync (h264_qsv, hevc_qsv) gets it in its own vocabulary (veryfast to veryslow; ultrafast and superfast become veryfast) and NVENC gets p1 to p7 (x264 words translated, veryfast is p2); VA-API, AMF and VideoToolbox, which have no preset option, get none, and a blank preset leaves the encoder default. Until now only libx264 and libx265 saw the preset, so hevc_qsv ran at its default medium: on an i5-8500T an HDR10 channel went from 2.0x to 3.5x real time with the default veryfast. README notes CPU passthrough for VMs (zscale needs AVX2).
  1.16.0.0: HDR channels. A profile's new Output setting (SDR, the default, or HDR10) makes a station a 10-bit BT.2020 PQ HEVC Main 10 channel: HDR10 programs keep their range and mastering metadata, HLG is converted to PQ, and SDR programs, slates, cards, the logo and weather screens are converted into the PQ container at SDR brightness, so the stream never changes format. Needs an HEVC encoder (libx265, hevc_qsv, hevc_nvenc, hevc_vaapi, hevc_amf, hevc_videotoolbox); HDR-capable clients direct play it and Jellyfin tone maps it for the rest (turn on tone mapping under Dashboard > Playback > Transcoding). The channel is declared as hevc Main 10 to Jellyfin instead of being probed (Jellyfin caches a channel's first probe for good, and skipping the probe makes tune-in quicker), the Hardware section lists the HEVC encoders in the ffmpeg build, Hardware Test takes an OutputRange override, and the Status page shows HDR10 out. Weather guide programs carry the station logo as their thumbnail (1.15.1.0).
  1.15.1.0: Weather channel: the weather program in the Live TV guide now shows the station's logo as its thumbnail when the station has one; it had no image before.
  1.15.0.0: Renamed to JellyStations. The plugin, its DLL (Jellyfin.Plugin.JellyStations.dll), the dashboard page, the API routes (/JellyStations/...) and the data folder (data/JellyStations) carry the new name. The plugin id is unchanged, so Jellyfin treats this as an update of the installed TvStation, an existing data/TvStation folder is moved to data/JellyStations on first start, and Live TV channels keep their ids. Plugin repository: add https://raw.githubusercontent.com/jdaubert12/JellyStations/main/manifest.json under Dashboard > Plugins > Repositories to install and update from the catalog. The example stations now carry placeholder titles.
  1.14.2.0: Weather channel: the music line on the screens now reads "Now playing: title – artist" (or just the title when no artist is known) instead of the bare title and artist. The editor checkbox that turns the line off is unchanged.
  1.14.1.0: Chance of rain, snow, mix or ice. Open-Meteo gives one chance of precipitation that covers rain, showers and snow together, so the percentage on the hourly strip, the 7-day forecast and the current conditions panel now says what it is a chance of: "rain", "snow", "mix" (rain and snow both forecast) or "ice" (freezing rain or drizzle). The type comes from the hourly and daily rain, showers and snowfall amounts now fetched with the forecast, else from the weather code, else from the temperature (at or below freezing it would fall as snow). Snow days on the 7-day forecast quote the snowfall depth ("5 in snow", "13 cm snow") instead of the melt-water total. The hourly strip puts the word on its own line under the percentage.
  1.14.0.0: Weather channel: a new station mode that shows current conditions, the next twelve hours and the week ahead for up to eight places, drawn by the plugin as full-screen graphics (three colour themes, the station logo, a live clock in each place's own time zone) that cross-fade and cycle like the cable weather channel, with an optional "on the 8s" pass at :08, :18, :28..., a travel-cities screen and hourly guide entries titled from the places. Forecasts come from Open-Meteo (free, no account; only each place's latitude and longitude is sent), polled every 15 minutes, cached on disk, and the screens say when a forecast is older than the station allows. Music plays underneath from Jellyfin music (playlists, albums, artists, music genres, tracks) and/or every audio file in a folder on the server, in a seeded shuffle that is the same for every viewer and crosses segment boundaries without a gap, with the track title and artist on screen. The editor gets a Weather channel preset, place search, a music picker, a forecast status table with Fetch now, and screen previews. New endpoints under /JellyStations/Weather (Search, Status, Refresh, Preview). The plugin ships no music; use tracks you have the right to play. Also: the Inter font (SIL OFL) is embedded for the screens. Music packs: the editor lists curated instrumental sets under licences that allow playing and passing them on; "Get it" fetches each track from the artist's own site into data/JellyStations/music/<pack>/ with a SHA-256 check and a CREDITS.txt (starter pack: thirty Kevin MacLeod lounge and light jazz pieces, CC BY 4.0; optional: HoliznaCC0 lo-fi jazz guitar, CC0, downloaded by hand from the Free Music Archive). The music folder setting takes several folders separated by ";".
  1.13.1.0: Fix: a station could keep encoding for nobody. Jellyfin only reports a viewer gone when the client says so or its connection to the server closes, so an app that was killed, a TV switched off on a channel or a dropped network connection left the viewer count stuck at 1 and ffmpeg running with no one reading the stream, sometimes for hours. The plugin now stops any station stream nobody has read for longer than the new "Stop an unwatched stream after" setting (default 120 seconds; 0 turns it off), whatever the viewer count says, and logs that it did. Linger is unchanged. Station editor: the Advanced section (call sign, padding grid, schedule anchor, station card text, encoding) was only shown under "All settings"; it now sits at the bottom of every step.
  1.13.0.0: "Up next" card. A station can draw a translucent panel over the last seconds of every program with the next program's title, its poster or episode thumbnail, the season and episode or the year, and its start and end time in the station's time zone (12 or 24-hour clock); choose the corner, the times before the end it appears (one or more, e.g. an hour, half an hour and five minutes), how long it stays, its height and opacity, whether to show the artwork and the times, and how it arrives and leaves (fade, slide in from the side, both, or neither). It is burned into the stream by the plugin's ffmpeg, so every viewer sees it in step with the picture whatever the client's HLS delay. Bumper clips and station breaks are skipped when choosing what to announce; programs too short for the card do without it; a card ffmpeg cannot draw is dropped for the session with a note on the station row. Off by default. Fix: QSV (Intel Quick Sync) decoding failed on every file with "Impossible to convert between the formats" and "Conversion failed", so stations and the hardware test never got Intel hardware decoding. ffmpeg 7's "-hwaccel qsv" leaves the *_qsv decoders' frames on GPU surfaces the software filters cannot read; the plugin now names the QSV decoder for the file's codec (h264_qsv, hevc_qsv, mpeg2_qsv, vc1_qsv, vp8_qsv, vp9_qsv, av1_qsv) on a QSV device created up front, which decodes to system memory, and a file whose codec was never recorded stays in software. The hardware test now confirms the decoder from ffmpeg's stream mapping (a *_qsv or *_cuvid decoder) or from the GPU device node ffmpeg holds open while it runs (Linux, software encoder); an explicit VA-API, CUDA, D3D11VA or VideoToolbox hwaccel that reports no fallback but cannot be confirmed from outside is "unverified" rather than a problem. Fix: with the h264_qsv, h264_nvenc or h264_amf encoder a client tuning in mid-program got audio but no video until the next program started (Jellyfin's remux of the channel logged "non-existing PPS 0 referenced" and wrote no video for 78 s): those encoders turn a forced key frame into a plain I frame without headers that no demuxer treats as a key frame, so they now set key frames by GOP alone, as Jellyfin does, and every GOP starts with an IDR frame and its SPS/PPS. libx264 and the VA-API encoders keep forced key frames.
  1.12.0.0: Stream health. Status shows, per active session, what the encoder is really doing: the hardware decoder confirmed by the GPU device node ffmpeg holds open (Linux), or flagged when ffmpeg fell back to software or the device failed; the encoder; HDR tone mapping; CPU cores in use; and how far ahead of real time the encoder runs, with a plain-language problem line when a station stutters or stalls. A Hardware section shows Jellyfin's transcoding setting, what the default profile resolves to, the /dev/dri nodes the server can see and this ffmpeg build's hwaccels, H.264 encoders and tone mapping filters, with notes on anything that does not line up. "Test" runs a few seconds of a station's current program through the real decode, filter and encode chain at full speed and reports which decoder ffmpeg attached and the speed relative to real time (GET /JellyStations/Hardware, POST /JellyStations/Hardware/Test). Fix: the GPU decoder was handed every file, and ffmpeg's qsv/cuda decoders do not fall back to software on their own, so one file the GPU cannot decode (10-bit H.264, DivX/Xvid, a codec unticked in Jellyfin) exited ffmpeg with "Nothing was written into output file" and switched the whole session to software. Stations now record each file's codec, profile, bit depth and pixel format (one recompile at startup) and decide per file: "Follow Jellyfin" honors Jellyfin's "Enable hardware decoding for" checkboxes and 10-bit HEVC/VP9/RExt toggles, a hand-picked decoder takes everything GPUs can decode; the rest plays in software and the Status page says why. If the decoder still refuses a file, only that program is replayed in software; a device-level failure, or a second program failing, still turns the session to software. Faults name the program and quote ffmpeg's first error line rather than its last.
  1.11.0.0: Stream fixes from a stuttering-playback diagnosis. HDR sources (PQ or HLG) are tone mapped to SDR BT.709 and stripped of HDR side data, and every segment is tagged BT.709, so clients no longer re-encode a channel because of "video range type"; stations are recompiled once at startup to record which items are HDR. Hardware decoding: new "Hardware decoding" and "Hardware device" fields on the encoding profile (default "Follow Jellyfin", which mirrors Dashboard > Playback > Transcoding: qsv, vaapi, cuda, videotoolbox or d3d11va), with the frames handed back to the software filters; a device that fails drops to software decoding for the session. VA-API encoders now get their device and frame upload, so h264_vaapi works. Reported media source carries the BT.709 SDR color tags. Frame rate and bitrate hints: 24 fps for film stations, 3500 kbps for 720p and 8000 for 1080p.
  1.10.5.0: Fix: a movie or episode added to a station by hand is never dropped by an excluded tag, even when a genre, library, collection or playlist source earlier in the same section lists it first. The station list no longer flags "1 empty source" for a hand-picked item that an earlier source already put on the station; a source only counts as empty when it adds nothing that is not already playing. Editor: when a movie already plays through a wider source of the same section (genre, tag, series, collection, playlist or library), search results say "Already included via Genre \"Comedy\"" and the chip of a hand-picked movie shows "also via" that source.
  1.10.4.0: Make a logo from the name: new "Pick the color too" option seeds the card color from the name, number and what the channel plays (remembered per browser); "Another look" then changes the color as well as the pattern.
  1.10.3.0: Make a logo from the name: the card now carries a pattern (gradient, stripes, dots, rings, slabs or color bars) seeded from the name, number and what the channel plays, so each channel looks different while the same station always draws the same card. "Another look" draws the next variation.
  1.10.2.0: Editor: the station's excluded tags, the switch for the plugin-wide excluded tags, and the minimum length now sit in a "Leave out" section on step 2 (What plays), with the Excluded items list under them, instead of under Advanced in All settings.
  1.10.1.0: Fix: the filter box on the Not on a channel page made Jellyfin's page setup throw, which left buttons, inputs and checkboxes across the dashboard unstyled. Install this over 1.10.0.0.
  1.10.0.0: Not on a channel: a dashboard page listing the movies and shows no channel plays (GET /JellyStations/Library/Coverage). Tick titles to start a new channel with them or add them to an existing channel's pool, filler or list; shows with only some episodes on a channel are marked; paused channels count only when asked; bumper and ident clips count as on their channel.
  1.9.0.0: Paint the week: the time blocks section shows a seven-day grid. Click or drag on it to add a block (drag sideways to cover several days), click a block to edit it; blocks that cross midnight continue in the next column and non-weekly ones are outlined.
  1.8.0.0: Three-step editor: Name and look (with a logo made from the name), What plays, When; All settings keeps the full form. The editor opens on step 1, remembers when you prefer the full form, and jumps to the step a problem is on when a save is refused.
  1.7.0.0: Cooldown: a pool can rest a show or film for N hours before it plays again (0 = off, Movie night preset uses 8). A gentle rule on the timeline: it holds films apart across the seam between two rounds and spaces out weighted repeats, and gives way when nothing rested is available. Stations with time blocks are not covered yet.
  1.6.0.0: Station rows show the time left in the current program and the next two programs, the last streaming error (permission denied, file not found and an unmounted folder told apart; early ffmpeg exits carry their last log line) with a dismiss button, and health badges from the last compile. The Status view gains a Health section (GET /JellyStations/Health): sources that matched nothing, stations under a day of unique content, items skipped for a missing runtime, path or file. Fixes a movie playing twice in a row across the seam between two shuffle cycles: the back-to-back rule now covers movies as well as series. Easier for non-technical people: an empty dashboard opens on what the library could support, New station starts from a preset (Kids channel, Movie night, Holiday channel and more), modes have plain names, Recompile is now Refresh content, daytime rules are Family hours, rarely used settings sit under Advanced, and health warnings carry fix buttons.
  1.5.0.0: Block recurrence: a block can repeat every week (as before), every N weeks from a chosen date, in certain weeks of the month (1st-4th or last; weeks run Monday-Sunday so a weekend stays together), or only on listed dates. Sequential blocks continue across occurrences, so a marathon over two weekends picks up where it left off.
  1.4.1.0: Dashboard: new "Recompile all" button re-scans the library for every station at once (for batches of newly added films) and refreshes the guide once if anything changed. Also available as POST /JellyStations/Stations/RecompileAll.
  1.4.0.0: Bumpers: pre-roll idents and post-roll clips. A pre-roll ends every break right before the next program (which still starts on the grid); a post-roll opens the break after one. Each picks from its own sources or the main bumper sources, and is skipped when no clip fits.
  1.3.1.0: Blocks: new per-block option to let the pool or filler finish its last program past the block end instead of cutting it (on for new blocks). Settings page gets a header and sectioned cards; the plugin page now has a title in the dashboard.
  1.3.0.0: Films split across files (Blu-ray part1/part2 that Jellyfin stacks into one movie) are scheduled at their full combined length and play straight through as one program. Also fixes repeated encoder restarts when a file ends a second before its listed runtime.
  1.2.1.0: Fix "Suggest stations" failing to load (GET request sent a body).
  1.2.0.0: Time blocks on Pool stations (a movie block at 18:00 while the pool keeps its shuffle, marathons and daytime rules); logo overlay over the video; Import matches movies, series, seasons, episodes and collections by name on another server; library analysis endpoint; Suggest stations on the dashboard (genres, series, kids and family, franchises, collections, decades, seasonal); block templates; per-station minimum runtime.
  1.1.0.0: Pool stations can carry weekly time blocks (for example a movie every evening 18:00-21:00) while the pool keeps playing between them with its shuffle, series spacing, marathons and daytime rules. Slots-mode filler is unchanged.
  1.0.0.0: Initial release.
